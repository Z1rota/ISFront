<div class="auth-page">
  <mat-card class="auth-card">
    <mat-card-header
      ><mat-card-title><h1>Вход</h1></mat-card-title></mat-card-header
    >
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" [attr.aria-busy]="loading">
        <fieldset [disabled]="loading">
          <mat-form-field appearance="outline">
            <mat-label>Имя пользователя</mat-label>
            <input matInput formControlName="username" autocomplete="username" />
            <mat-error>Введите имя пользователя</mat-error>
          </mat-form-field>
          <mat-form-field appearance="outline">
            <mat-label>Пароль</mat-label>
            <input
              matInput
              type="password"
              formControlName="password"
              autocomplete="current-password"
            />
            <mat-error>Введите пароль</mat-error>
          </mat-form-field>
          <button mat-flat-button type="submit" [disabled]="loading">
            {{ loading ? 'Подождите...' : 'Войти' }}
          </button>
        </fieldset>
        @if (loading) {
          <mat-progress-bar mode="indeterminate" aria-label="Вход" />
        }
      </form>
      <a mat-button routerLink="/register">Создать аккаунт</a>
    </mat-card-content>
  </mat-card>
</div>
