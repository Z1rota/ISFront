<h2 mat-dialog-title>
  Create location
</h2>

<mat-dialog-content>

  <form
    [formGroup]="form"
    class="location-form"
  >

    <mat-form-field appearance="outline">

      <mat-label>X</mat-label>

      <input
        matInput
        type="number"
        formControlName="x"
      >

      @if (
        form.get('x')?.touched &&
        form.get('x')?.hasError('required')
      ) {
        <mat-error>
          X is required
        </mat-error>
      }

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>Y</mat-label>

      <input
        matInput
        type="number"
        formControlName="y"
      >

    </mat-form-field>


    <mat-form-field appearance="outline">

      <mat-label>Z</mat-label>

      <input
        matInput
        type="number"
        formControlName="z"
      >

    </mat-form-field>

  </form>

</mat-dialog-content>


<mat-dialog-actions align="end">

  <button
    mat-button
    type="button"
    (click)="cancel()"
  >
    Cancel
  </button>

  <button
    mat-flat-button
    type="button"
    (click)="save()"
  >
    Create
  </button>

</mat-dialog-actions>
